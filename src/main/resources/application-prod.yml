
# Railway는 컨테이너가 반드시 주입된 PORT로 리슨해야 한다. 미주입 시(로컬 prod 테스트) 8080.
server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB      # 단일 파일 최대 크기
      max-request-size: 50MB   # 전체 요청 최대 크기

  datasource:
    # 운영 DB: Railway MySQL. 접속정보는 기본값을 두지 않는다(fail-fast) — 미설정 시 기동을 실패시켜
    # 배포 설정 누락을 즉시 드러낸다. Railway 서비스 변수 예시(Reference Variables):
    #   SPRING_DATASOURCE_URL=jdbc:mysql://${{MySQL.MYSQLHOST}}:${{MySQL.MYSQLPORT}}/${{MySQL.MYSQLDATABASE}}
    #   SPRING_DATASOURCE_USERNAME=${{MySQL.MYSQLUSER}}
    #   SPRING_DATASOURCE_PASSWORD=${{MySQL.MYSQLPASSWORD}}
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true  # JPA 초기화 후 SQL 실행
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        default_batch_fetch_size: 100
        # MySQL 8.x dialect
        dialect: org.hibernate.dialect.MySQLDialect
        # (제거됨) schema-generation.scripts.action=drop-and-create:
        #   ddl-auto=update와 중복되고 create/drop-target 경로가 없어 기동 중 예외 위험이 있었음.
        #   스키마는 ddl-auto(update) 또는 별도 마이그레이션 도구로 관리한다.
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never  # 운영에서 SQL 초기화 비활성화

  # H2 콘솔은 운영에 존재해선 안 된다(감사 2026-08-25 H1) — 기본 application.yml의 true를 명시적으로 되돌린다.
  # 콘솔은 접속자가 임의 JDBC URL을 넣을 수 있어 정보 노출로 끝나지 않는다(RCE 경로).
  # true로 바꾸면 RailwayDeploymentValidator가 기동을 거부한다(fail-fast) — 편집 모드와 같은 자세다.
  h2:
    console:
      enabled: false

  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: ${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${APP_BASE_URL:http://localhost:8080}/login/oauth2/code/google
            scope:
              - profile
              - email
            authorization-grant-type: authorization_code
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type: WARN
    com.test.test: INFO   # 실제 애플리케이션 패키지 (기존 com.example 은 잘못된 값이라 무효였음)

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration_access: 1800000   # 30분
  expiration_refresh: 14400000 # 4시간

# 쿠키 보안 설정 (운영: HTTPS이므로 true)
app:
  cookie:
    secure: true

  # 편집 모드는 로컬 전용(설계/04 §9) — 기본 application.yml의 true를 명시적으로 되돌린다.
  # true로 바꾸면 RailwayDeploymentValidator가 기동을 거부한다(fail-fast).
  editor:
    enabled: false

  # 파일 저장: Railway Storage Buckets(S3 호환) 사용 (§5-3).
  # BUCKET_* 미설정 시 RailwayDeploymentValidator 가 기동을 실패(fail-fast)시킨다.
  bucket:
    endpoint: ${BUCKET_ENDPOINT:}
    access-key-id: ${BUCKET_ACCESS_KEY_ID:}
    secret-access-key: ${BUCKET_SECRET_ACCESS_KEY:}
    name: ${BUCKET_NAME:}
    region: ${BUCKET_REGION:us-east-1}

  # orphan 파일 정리 유예시간(시간) — §5-3-1 ③
  file:
    orphan-grace-hours: ${ORPHAN_GRACE_HOURS:24}

# Swagger/OpenAPI: 운영에서는 비활성화 (API 명세 비인증 노출 방지)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Actuator 설정 (서버 상태 모니터링)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

# 파일 업로드 경로 (버킷 미설정 시 폴백. 운영은 버킷 사용이 표준)
file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}

