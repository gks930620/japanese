plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	 // 1. Querydsl 라이브러리 추가
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'  // Validation 추가
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Railway Storage Buckets (S3 완전 호환) — 파일 저장 표준 (§5-3). BOM으로 버전 일괄 관리.
	implementation platform('software.amazon.awssdk:bom:2.28.16')
	implementation 'software.amazon.awssdk:s3'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// .env 파일 읽기용
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// Swagger (API 문서화)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// Actuator (서버 상태 모니터링)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	runtimeOnly 'com.mysql:mysql-connector-j'  // 배포(prod)용 MySQL 드라이버 (Railway MySQL)
	runtimeOnly 'com.h2database:h2'  // 개발/테스트용 인메모리 DB (외부 DB 불필요). 배포는 prod 프로파일에서 Railway MySQL 사용

	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def frontendDir = file("${projectDir}/frontend")
def frontendBuildDir = file("${frontendDir}/dist")
def staticDir = file("${projectDir}/src/main/resources/static")
def npmExecutable = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "npm.cmd" : "npm"

// ── 프론트엔드(React) 번들 → Spring static 반영 ────────────────────────────
// 설계 §7-15: 백엔드 테스트는 프론트 번들 빌드에 묶지 않는다.
//  - `gradlew test`  : 프론트 태스크를 타지 않는다(npm 없이도 돌고, vite dev 서버가 떠 있어도 파일 잠금 충돌이 없다)
//  - `gradlew bootJar`: 배포 산출물에는 항상 최신 번들이 포함된다
//  - 로컬에서 bootRun으로 SPA를 보려면 필요할 때 `gradlew copyFrontendBuild`를 먼저 실행한다
tasks.register("frontendInstall", Exec) {
	workingDir frontendDir
	commandLine npmExecutable, "ci"
	onlyIf { frontendDir.exists() }
	// 의존성이 그대로면 다시 설치하지 않는다(재빌드 시간 단축)
	inputs.files(file("${frontendDir}/package.json"), file("${frontendDir}/package-lock.json"))
			.withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.dir(file("${frontendDir}/node_modules"))
}

tasks.register("frontendBuild", Exec) {
	dependsOn "frontendInstall"
	workingDir frontendDir
	commandLine npmExecutable, "run", "build"
	onlyIf { frontendDir.exists() }
	inputs.dir(file("${frontendDir}/src")).withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.files(file("${frontendDir}/index.html"), file("${frontendDir}/vite.config.js"),
			file("${frontendDir}/package.json"))
	outputs.dir(frontendBuildDir)
}

// Sync = "빌드 결과와 똑같이 맞추기". 별도 Delete 태스크로 먼저 비우지 않으므로,
// 프론트 빌드가 실패하면 static/ 이 빈 채로 남는 사고가 구조적으로 일어나지 않는다.
tasks.register("copyFrontendBuild", Sync) {
	dependsOn "frontendBuild"
	from frontendBuildDir
	into staticDir
	preserve { include ".gitkeep" }
	onlyIf { frontendDir.exists() }
}

// 번들은 배포 산출물(bootJar)에만 필수다. jar 안에 들어가려면 processResources보다 먼저 끝나야 한다.
tasks.named("bootJar") {
	dependsOn "copyFrontendBuild"
}
tasks.named("processResources") {
	mustRunAfter "copyFrontendBuild"
}

tasks.named('test') {
	useJUnitPlatform()
}

// ── 운영 배포용 콘텐츠 시드 번들 ──────────────────────────────────────────
// 설계/07 §1: 운영 프로파일은 `spring.sql.init.mode: never` 라 학습 콘텐츠 시드가 운영 MySQL에
// 자동으로 들어가지 않는다. 사람이 시드 파일을 "정확한 순서로" 하나씩 실행하던 것을 파일 하나로 묶는다.
//   - 순서는 application.yml 에 적힌 그대로다(`*-content.sql` 이 같은 코스의 `*-units.sql` 보다 먼저).
//   - 목록의 단일 기준도 application.yml 이다 — 여기에 목록을 다시 적지 않는다(적으면 드리프트 원인이 하나 는다).
// 실행: gradlew prodSeedBundle  →  build/prod-seed.sql
// 어떤 기존 태스크의 의존성으로도 걸지 않는다(빌드·테스트 동작을 바꾸지 않는다).
tasks.register("prodSeedBundle") {
	group = "distribution"
	description = "운영 MySQL에 수동 적재할 학습 콘텐츠 시드를 build/prod-seed.sql 하나로 묶는다 (설계/07 §1)"

	def appYml = file("${projectDir}/src/main/resources/application.yml")
	def seedDir = file("${projectDir}/src/main/resources")
	def bundleFile = layout.buildDirectory.file("prod-seed.sql").get().asFile

	inputs.file(appYml)
	inputs.files(fileTree(seedDir) { include "data-*.sql" }).withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.file(bundleFile)

	doLast {
		// 운영에 적재하면 안 되는 시드 — 파일명 → 제외 이유(한 줄).
		// 넣으면 운영에 테스트 계정과 보일러플레이트 유래 게시글이 생긴다.
		def EXCLUDED = [
				"data-users.sql"            : "테스트 계정 — 운영에 남의 로그인 계정이 생긴다",
				"data-user-roles.sql"       : "위 테스트 계정의 권한 행 — data-users.sql 의 짝이라 함께 뺀다",
				"data-community.sql"        : "보일러플레이트 유래 인형뽑기 게시글 — 학습 사이트와 무관",
				"data-comment.sql"          : "위 게시글에 달린 댓글 — 같은 이유",
				"data-files.sql"            : "보일러플레이트 유래 첨부파일 행 — 실제 파일이 없는 깨진 참조",
				"data-h2-reset-identity.sql": "H2 전용 시퀀스 리셋 — MySQL에서는 문법부터 맞지 않는다",
		]

		if (!appYml.exists()) {
			throw new GradleException("application.yml 을 찾을 수 없다: ${appYml}")
		}

		// ── 1) application.yml 에서 data-locations 목록을 순서 그대로 읽는다 ──
		// 이 블록은 `- classpath:....sql` 형태의 단순 목록이라 줄 단위 파싱으로 충분하다(새 의존성 금지).
		def lines = appYml.getText("UTF-8").replaceFirst(/^﻿/, "").readLines()
		def keyIdx = []
		lines.eachWithIndex { line, i -> if (line ==~ /^\s*data-locations:\s*$/) keyIdx << i }
		if (keyIdx.size() != 1) {
			throw new GradleException("application.yml 에서 sql.init.data-locations 블록을 정확히 1개 찾지 못했다" +
					"(찾은 개수: ${keyIdx.size()}). YAML 구조가 바뀌었다면 이 태스크의 파싱 규칙도 고쳐야 한다.")
		}
		def keyIndent = lines[keyIdx[0]].length() - lines[keyIdx[0]].replaceAll(/^\s+/, "").length()

		def locations = []
		for (int i = keyIdx[0] + 1; i < lines.size(); i++) {
			def raw = lines[i]
			def trimmed = raw.trim()
			if (trimmed.isEmpty() || trimmed.startsWith("#")) continue   // 빈 줄·주석은 건너뛴다
			def indent = raw.length() - raw.replaceAll(/^\s+/, "").length()
			if (!trimmed.startsWith("- ") || indent <= keyIndent) break  // 목록 끝(다음 키)
			locations << trimmed.substring(2).replaceFirst(/\s+#.*$/, "").trim()
		}

		def seedNames = locations.collect { loc ->
			def v = loc.replaceAll(/^["']|["']$/, "")
			if (v.startsWith("optional:")) v = v.substring("optional:".length())
			if (!v.startsWith("classpath:")) {
				throw new GradleException("data-locations 에 classpath: 가 아닌 항목이 있다: '${loc}' — 이 태스크는 classpath 시드만 묶는다.")
			}
			v.substring("classpath:".length()).trim()
		}
		if (seedNames.isEmpty()) {
			throw new GradleException("application.yml 의 data-locations 에서 시드 파일을 하나도 읽지 못했다. 파싱 규칙을 확인하라.")
		}

		// ── 2) 제외 목록을 걸러 낸다 ──
		def included = seedNames.findAll { !EXCLUDED.containsKey(it) }
		def excluded = seedNames.findAll { EXCLUDED.containsKey(it) }
		if (included.isEmpty()) {
			throw new GradleException("제외하고 나니 포함할 시드가 0개다. data-locations(${seedNames.size()}개)가 전부 제외 목록에 걸렸다.")
		}

		// ── 3) 검증: 목록에 있는데 실제로 없는 파일이 하나라도 있으면 실패(조용히 건너뛰지 않는다) ──
		def missing = included.findAll { !new File(seedDir, it).isFile() }
		if (!missing.isEmpty()) {
			throw new GradleException("시드 파일이 없다: ${missing.join(', ')}\n" +
					"  찾은 곳: ${seedDir}\n" +
					"  application.yml 의 data-locations 와 실제 파일 이름이 어긋났다. 둘 중 하나를 고쳐라.")
		}

		// ── 4) 머리 주석 + 순서대로 이어 붙이기 ──
		def now = java.time.LocalDateTime.now().format(java.time.format.DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss"))
		def bar = "-- " + ("=" * 74)
		def sb = new StringBuilder()
		sb.append(bar).append("\n")
		sb.append("--  운영 배포용 콘텐츠 시드 번들\n")
		sb.append("--\n")
		sb.append("--  !! 이 파일은 생성물이다 — 고치지 말고 시드 SQL(src/main/resources/data-*.sql)을 고쳐라.\n")
		sb.append("--     고친 뒤 `gradlew prodSeedBundle` 로 다시 만든다. 여기에 직접 손대면 다음 생성 때 사라진다.\n")
		sb.append("--\n")
		sb.append("--  생성 시각 : ${now}\n")
		sb.append("--  원본      : src/main/resources/application.yml 의 spring.sql.init.data-locations\n")
		sb.append("--              (순서도 그 목록 그대로 — *-content.sql 이 같은 코스의 *-units.sql 보다 먼저)\n")
		sb.append("--  포함      : ${included.size()}개 파일\n")
		included.eachWithIndex { name, i -> sb.append("--              ${String.format('%2d', i + 1)}. ${name}\n") }
		sb.append("--  제외      : ${excluded.size()}개 파일 (운영에 적재하면 안 되는 것)\n")
		excluded.each { name -> sb.append("--              - ${name}  — ${EXCLUDED[name]}\n") }
		sb.append("--\n")
		sb.append("--  실행      : mysql -h <HOST> -P <PORT> -u <USER> -p --default-character-set=utf8mb4 <DB> < build/prod-seed.sql\n")
		sb.append(bar).append("\n")

		included.each { name ->
			def text = new File(seedDir, name).getText("UTF-8").replaceFirst(/^﻿/, "")
			sb.append("\n-- ===== ${name} =====\n")
			sb.append(text)
			if (!text.endsWith("\n")) sb.append("\n")
		}
		def bundleText = sb.toString()

		// ── 5) 검증: 제외 대상이 결과물에 섞이지 않았는지 ──
		def leaked = EXCLUDED.keySet().findAll { name ->
			included.contains(name) || bundleText.contains("-- ===== ${name} =====")
		}
		if (!leaked.isEmpty()) {
			throw new GradleException("제외해야 할 시드가 번들에 섞였다: ${leaked.join(', ')} — 필터가 동작하지 않았다.")
		}

		bundleFile.parentFile.mkdirs()
		bundleFile.write(bundleText, "UTF-8")   // 일본어·한국어 포함 — 인코딩을 기본값에 맡기지 않는다

		logger.lifecycle("prodSeedBundle → ${bundleFile}")
		logger.lifecycle("  포함 ${included.size()}개 / 제외 ${excluded.size()}개 (${excluded.join(', ')})")
		logger.lifecycle("  크기 ${bundleFile.length()} bytes")
	}
}
